[package]
name = "tc_asn1"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BER, CER and DER codecs for the ASN.1 universal types."
readme = "CRATES.md"
documentation = "https://docs.rs/tc_asn1"
keywords = ["asn1", "der", "ber", "x690", "no-std"]
categories = ["encoding", "parser-implementations", "no-std"]
include = ["src/**", "tests/**", "CRATES.md", "README.md", "IO.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Zeroize for every type that owns data; off by default, so the crate keeps no dependencies.
zeroize = ["dep:tc_zeroize"]
# Conversions between UTCTime/GeneralizedTime and chrono's DateTime<Utc>.
chrono = ["dep:chrono"]
# Asn1Writer over std::io::Write; adds no dependency, only the standard library.
std = []

[dependencies]
tc_zeroize = { version = "0.1.0", default-features = false, features = ["alloc"], optional = true }
chrono = { version = "0.4.38", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
